version: '3.8'

services:
  playwright-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: playwright-studio-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      
      # Optional Manual Login Admin credentials (fallback)
      - ADMIN_EMAIL=admin@example.com
      - ADMIN_PASSWORD=adminpassword
      
      # Automatically injected by active host environment
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - APP_URL=${APP_URL:-http://localhost:3000}
    volumes:
      - studio-data:/app/server-data
      - studio-screenshots:/app/screenshots
      - studio-pdf:/app/pdf
      - studio-excel:/app/excel
      - studio-uploads:/app/uploads

volumes:
  studio-data:
    driver: local
    name: playwright_studio_data
  studio-screenshots:
    driver: local
    name: playwright_studio_screenshots
  studio-pdf:
    driver: local
    name: playwright_studio_pdfs
  studio-excel:
    driver: local
    name: playwright_studio_excels
  studio-uploads:
    driver: local
    name: playwright_studio_uploads
